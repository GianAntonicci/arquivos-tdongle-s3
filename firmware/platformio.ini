; T-Dongle Bridge — firmware
; Rodar sempre de dentro de firmware/:  pio run  |  pio run -t upload
;
; Plataforma: pioarduino (Arduino-ESP32 3.3.x). A plataforma "espressif32"
; oficial do PlatformIO parou no core 2.0.x; a LilyGO recomenda core >= 3.3.0
; para os exemplos de USB/HID do T-Dongle S3.

[platformio]
default_envs = tdongle

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; T-Dongle S3: 16 MB de flash QIO, SEM PSRAM
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

monitor_speed = 115200

lib_deps =
    lovyan03/LovyanGFX@^1.2.7

; A placa base define USB_MODE=1 (Hardware CDC/JTAG); trocamos por TinyUSB (OTG)
build_unflags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

build_flags =
    ; USB nativa via TinyUSB: CDC + HID compostos, criados pelo próprio firmware
    -DARDUINO_USB_MODE=0
    ; CDC_ON_BOOT=0: criamos a CDC manualmente para poder fixar VID/PID e nomes
    ; antes de USB.begin(). (Com =1 o core sobe a USB antes do setup().)
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    ; Tamanho do bloco entregue pelo WebServer no callback de upload
    -DHTTP_UPLOAD_BUFLEN=4096
    -DHTTP_RAW_BUFLEN=4096
    ; Logs de debug via frame LOG do protocolo (0 = desligado em produção)
    -DDEBUG_LOG=0
    -Wall

[env:tdongle]

; Mesmo firmware com logs de debug ligados
[env:tdongle-debug]
build_unflags =
    ${env.build_unflags}
    -DDEBUG_LOG=0
build_flags =
    ${env.build_flags}
    -DDEBUG_LOG=1

; Etapa (c): aceita uploads e descarta os dados (mede a velocidade do Wi-Fi sem PC)
[env:tdongle-nullsink]
build_flags =
    ${env.build_flags}
    -DBRIDGE_NULL_SINK=1

; Modo de demonstração da UI: clique curto percorre todas as telas com dados falsos
[env:tdongle-demo]
build_flags =
    ${env.build_flags}
    -DUI_DEMO=1
